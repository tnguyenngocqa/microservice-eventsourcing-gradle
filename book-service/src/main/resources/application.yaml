server:
  port: 9001

spring:
  application:
    name: bookservice
  # H2 Console Configuration (optional, but helpful for debugging)
  h2:
    console:
      enabled: true
      path: /h2-console
  # Datasource Configuration
  datasource:
    url: jdbc:h2:mem:bookDB
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # DDL Configuration using Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
